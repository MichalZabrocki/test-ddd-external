version: '3'

services:
  php:
    user: "${UID}:${GID}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8040:8040"
      - "9040:9001"
    volumes:
      - .:/app
    depends_on:
      - database
    command: symfony serve --dir=app//base --port=8040 --allow-all-ip


  database:
      image: mariadb:10.7.4
      ports:
          - "3360:3306"
      environment:
          - MYSQL_ROOT_PASSWORD=
          - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      healthcheck:
          test: ["CMD", "mysqladmin", "--user=root", "--password=", "--host=127.0.0.1", "ping", "--silent"]
          interval: 2s
          timeout: 10s
          retries: 10
      command: ["--default-authentication-plugin=mysql_native_password"]
